        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">列转行工具</h1>
                <p class="page-description">
                    将一列数据快速转换成一行，支持逗号分隔和引号包裹。适合用于 SQL、CSV、日志或命令行参数。
                </p>
            </div>

            <div class="tool-card">
                <div class="textarea-wrapper">
                    <label class="textarea-label">输入数据（每行一个值）</label>
                    <textarea id="input" rows="12" placeholder="请输入数据，每行一个值：&#10;例如：&#10;apple&#10;banana&#10;orange"></textarea>
                    <p style="font-size: 13px; color: #64748b; margin-top: 8px;">
                        💡 空行会自动忽略，每行的前后空格会自动移除
                    </p>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" id="btnComma">
                        📝 逗号分隔
                    </button>
                    <button class="btn btn-secondary" id="btnQuotedComma">
                        📋 带引号分隔
                    </button>
                    <button class="btn btn-outline" id="btnClear">
                        🗑️ 清空
                    </button>
                </div>

                <div id="error-message" class="error-message"></div>

                <div class="textarea-wrapper">
                    <label class="textarea-label">转换结果</label>
                    <textarea id="output" rows="6" placeholder="结果会显示在这里..." readonly></textarea>
                    <p style="font-size: 13px; color: #64748b; margin-top: 8px;">
                        ✨ 结果已是一行文本，适合直接粘贴使用
                    </p>
                </div>

                <div class="button-group">
                    <button class="btn btn-success" id="btnCopy">
                        📋 复制结果
                    </button>
                </div>
            </div>

            <footer class="footer">
                <p>© 2025 在线工具集. 所有处理在本地完成</p>
            </footer>
        </main>
    </div>

    <script>
        function getCleanItems() {
            const raw = document.getElementById('input').value || '';
            return raw
                .split(/\r?\n/)               // 按行分割
                .map(s => s.trim())           // 去掉前后空格
                .filter(s => s.length > 0);   // 过滤空行
        }

        function setOutput(text) {
            const out = document.getElementById('output');
            out.value = text;
        }

        document.getElementById('btnComma').addEventListener('click', () => {
            const items = getCleanItems();
            if (items.length === 0) {
                showError('请输入至少一行内容');
                return;
            }
            setOutput(items.join(','));
            hideError();
        });

        document.getElementById('btnQuotedComma').addEventListener('click', () => {
            const items = getCleanItems().map(s => `'${s.replace(/'/g, "\\'")}'`);
            if (items.length === 0) {
                showError('请输入至少一行内容');
                return;
            }
            setOutput(items.join(','));
            hideError();
        });

        document.getElementById('btnCopy').addEventListener('click', async () => {
            const text = document.getElementById('output').value;
            if (!text) {
                showError('没有可复制的内容');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                document.getElementById('error-message').style.backgroundColor = '#f0fdf4';
                document.getElementById('error-message').style.color = '#16a34a';
                showError('✓ 复制成功！');
                setTimeout(() => {
                    hideError();
                    document.getElementById('error-message').style.backgroundColor = '';
                    document.getElementById('error-message').style.color = '';
                }, 2000);
            } catch (e) {
                // 降级方案：使用传统的复制方式
                const output = document.getElementById('output');
                output.select();
                try {
                    document.execCommand('copy');
                    document.getElementById('error-message').style.backgroundColor = '#f0fdf4';
                    document.getElementById('error-message').style.color = '#16a34a';
                    showError('✓ 复制成功！');
                    setTimeout(() => {
                        hideError();
                        document.getElementById('error-message').style.backgroundColor = '';
                        document.getElementById('error-message').style.color = '';
                    }, 2000);
                } catch (err) {
                    showError('复制失败，请手动选中结果文本后 Ctrl/Cmd+C 复制');
                }
            }
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            document.getElementById('input').value = '';
            setOutput('');
            hideError();
        });

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function hideError() {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = '';
            errorElement.classList.remove('show');
        }
    </script>
</body>
</html>
