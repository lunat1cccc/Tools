</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">

            <nav>

                            <span>全部工具</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="JsonConverter.html" class="nav-link">

                        </a>

                    <li class="nav-item">
                        <a href="TransFormat.html" class="nav-link">
                            <span class="nav-icon">⚡</span>
                            <span>格式转换器</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="ToSplit.html" class="nav-link">

                            <span>列转行工具</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="PasswordGenerator.html" class="nav-link">
                            <span class="nav-icon">🔐</span>
                            <span>密码生成器</span>
                        </a>
                    </li>
                        <li class="nav-item">
                            <a href="splitManyData.html" class="nav-link">

                            </a>

                        <li class="nav-item">

                            </a>

                            </a>
                        </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Base64 编解码</h1>
                <p class="page-description">
                    免费在线 Base64 编码和解码工具，快速转换文本数据。所有处理在本地完成，保护您的隐私安全。
                </p>
            </div>

            <div class="tool-card">
                <div class="textarea-wrapper">
                    <label class="textarea-label">输入内容</label>
                    <textarea id="input" rows="10" placeholder="在此输入要编码或解码的内容..."></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeBase64()">
                        🔒 编码为 Base64
                    </button>
                    <button class="btn btn-secondary" onclick="decodeBase64()">
                        🔓 解码 Base64
                    </button>
                    <button class="btn btn-outline" onclick="clearAll()">
                        🗑️ 清空
                    </button>
                </div>

                <div id="error-message" class="error-message"></div>

                <div class="textarea-wrapper">
                    <label class="textarea-label">转换结果</label>
                    <textarea id="output" rows="12" placeholder="转换结果将显示在这里..." readonly></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-success" onclick="copyResult()">
                        📋 复制结果
                    </button>
                </div>
            </div>

            <footer class="footer">
                <p>© 2025 在线工具集. 所有处理在本地完成</p>
            </footer>
        </main>
    </div>

    <script>
        function encodeBase64() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');

            if (!input) {
                showError('请输入要编码的内容');
                return;
            }

            try {
                // 支持中文编码
                const encoded = btoa(unescape(encodeURIComponent(input)));
                output.value = encoded;
                hideError();
            } catch (e) {
                showError('编码失败：' + e.message);
                output.value = '';
            }
        }

        function decodeBase64() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');

            if (!input.trim()) {
                showError('请输入要解码的 Base64 内容');
                return;
            }

            try {
                // 支持中文解码
                const decoded = decodeURIComponent(escape(atob(input.trim())));
                output.value = decoded;
                hideError();
            } catch (e) {
                showError('解码失败：输入的 Base64 格式不正确');
                output.value = '';
            }
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            hideError();
        }

        function copyResult() {
            const output = document.getElementById('output');
            if (!output.value) {
                showError('没有可复制的内容');
                return;
            }
            
            output.select();
            document.execCommand('copy');
            
            // 临时显示成功消息
            document.getElementById('error-message').style.backgroundColor = '#f0fdf4';
            document.getElementById('error-message').style.color = '#16a34a';
            showError('✓ 复制成功！');
            
            setTimeout(() => {
                hideError();
                document.getElementById('error-message').style.backgroundColor = '';
                document.getElementById('error-message').style.color = '';
            }, 2000);
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function hideError() {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = '';
            errorElement.classList.remove('show');
        }
    </script>
</body>
</html>
